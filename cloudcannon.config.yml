collections_config:
  pages:
    path: ''
    glob:
      - '*.html'
    name: Pages
    icon: page
    disable_url: false
    include_developer_files: false
    _enabled_editors:
      - source
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  data:
    path: data
    icon: data_usage
    disable_url: false
    include_developer_files: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
_inputs:
  register_url:
    type: url
    label: Registration URL
    comment: Link for the "Register Now" button throughout the site
    cascade: true
  store_url:
    type: url
    label: Club Store URL
    comment: Link to the team gear store
    cascade: true
  field_status_csv:
    type: url
    label: Field Status Google Sheet CSV URL
    comment: >-
      Publish your Field Status sheet: File > Share > Publish to web > CSV,
      paste URL here
    cascade: true
  announcements_csv:
    type: url
    label: Announcements Google Sheet CSV URL
    comment: Leave blank to use CloudCannon announcements
    cascade: true
  google_calendar_src:
    type: url
    label: Google Calendar Embed URL
    comment: The src= URL from your Google Calendar embed code
    cascade: true
  name:
    type: text
    label: Name
    cascade: true
  role:
    type: text
    label: Role / Title
    cascade: true
  email:
    type: email
    label: Email Address
    cascade: true
  photo:
    type: image
    label: Photo
    comment: Upload an announcement image
    cascade: true
    uploads_dir: uploads
  title:
    type: text
    label: Title
    cascade: true
  date:
    type: text
    label: Date
    comment: e.g. May 14, 2026 — leave blank if not applicable
    cascade: true
  description:
    type: textarea
    label: Description
    cascade: true
  link_url:
    type: url
    label: Link URL
    comment: Optional — leave blank if no link
    cascade: true
  active:
    type: checkbox
    label: Show on site
    comment: Uncheck to hide this announcement without deleting it
    cascade: true
  open:
    type: checkbox
    label: Open Position
    comment: Check this if the seat is currently vacant
    cascade: true
  bio:
    type: textarea
    label: Bio
    comment: Optional short bio — displays on the website
    cascade: true
  meeting_dates:
    type: text
    label: Membership Meeting Dates
    comment: Shown in the banner on the Calendar page (e.g. Aug 19 · Sep 16 · Oct 21)
    cascade: true
  name:
    type: text
    label: Season Name
    comment: e.g. Fall 2026
    cascade: true
  bullets:
    type: array
    label: Schedule Bullets
    cascade: true
  game_day_bullets:
    type: array
    label: Game Day Info
    cascade: true
  mission_intro:
    type: textarea
    label: Mission Intro Paragraph
    cascade: true
  mission_bullets:
    type: array
    label: Mission Bullet Points
    cascade: true
  mission_closing:
    type: textarea
    label: Mission Closing Paragraph
    cascade: true
  coaching_statement:
    type: textarea
    label: Coaching Statement
    cascade: true
  director_name:
    type: text
    label: Director of Coaching Name
    cascade: true
  director_email:
    type: email
    label: Director of Coaching Email
    cascade: true
  youth_trainer_bullets:
    type: array
    label: Youth Trainer Requirements
    cascade: true
  rec_coach_bullets:
    type: array
    label: Recreational Coach Info
    cascade: true
  travel_coach_bullets:
    type: array
    label: Travel Coach Info
    cascade: true
data_config:
  board:
    path: data/board.json
  announcements:
    path: data/announcements.json
  settings:
    path: data/settings.json
  calendar:
    path: data/calendar.json
  coaches:
    path: data/coaches.json
  club_info:
    path: data/club-info.json
timezone: Etc/UTC
_array_structures:
  announcements:
    values:
      - label: Announcement
        value:
          title: ''
          date: ''
          description: ''
          link_url: ''
          photo: ''
          active: true
  board:
    values:
      - label: Board Member
        value:
          name: ''
          role: ''
          email: ''
          photo: ''
          bio: ''
          open: false
      - label: Open Position
        value:
          name: Open Position
          role: ''
          email: ''
          photo: ''
          bio: ''
          open: true
