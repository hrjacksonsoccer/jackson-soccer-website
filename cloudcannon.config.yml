    cascade: true
  resource_forms:
    type: array
    label: Resource Forms
    cascade: true
  accounting_forms:
    type: array
    label: Accounting Forms
    comment: >-
      ACTION NEEDED: "Check Request Form" and "Deposit Request Form" still point
      at old /LinkClick.aspx?... addresses from the previous DNN website. Those
      links are broken. Replace both URLs with the real Google Drive / Google
      Form links.
    cascade: true
  policy_docs:
    type: array
    label: Policy Documents
    cascade: true
  rental_email:
    type: email
    label: Field Rental Email
    cascade: true
  rental_info:
    type: textarea
    label: Field Rental Information
    cascade: true
  justice_address:
