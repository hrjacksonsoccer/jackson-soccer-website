# CloudCannon CMS Configuration — Jackson Soccer Club
# Plain HTML site with JSON-driven content

collections_config:
  pages:
    path: ''
    glob:
      - '*.html'
    output: true
    _enabled_editors:
      - source
    icon: page
    name: Pages

data_config:
  board:
    path: data/board.json
  settings:
    path: data/settings.json

_inputs:
  # Settings fields
  register_url:
    type: url
    label: Registration URL
    comment: Link for the "Register Now" button throughout the site
  store_url:
    type: url
    label: Club Store URL
    comment: Link to the team gear store
  field_status_csv:
    type: url
    label: Field Status Google Sheet CSV URL
    comment: "Publish your Field Status sheet: File > Share > Publish to web > CSV, paste URL here"
  announcements_csv:
    type: url
    label: Announcements Google Sheet CSV URL
    comment: Leave blank to use demo announcements
  google_calendar_src:
    type: url
    label: Google Calendar Embed URL
    comment: The src= URL from your Google Calendar embed code

  # Board member fields
  name:
    type: text
    label: Name
  role:
    type: text
    label: Role / Title
  email:
    type: email
    label: Email Address
  photo:
    type: image
    label: Headshot Photo
    comment: Upload a headshot photo (square crop works best)
    uploads_dir: assets/board
  open:
    type: checkbox
    label: Open Position
    comment: Check this if the seat is currently vacant
  bio:
    type: textarea
    label: Bio
    comment: Optional short bio or note — displays below their title on the website

_array_structures:
  board:
    values:
      - label: Board Member
        value:
          name: ''
          role: ''
          email: ''
          photo: ''
          bio: ''
          open: false
      - label: Open Position
        value:
          name: Open Position
          role: ''
          email: ''
          photo: ''
          bio: ''
          open: true
