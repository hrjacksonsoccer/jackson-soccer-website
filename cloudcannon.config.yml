    type: email
    label: General Inquiries Email
    cascade: true
  travel_commissioner_name:
    type: text
    label: Travel Commissioner Name
    cascade: true
  travel_commissioner_email:
    type: email
    label: Travel Commissioner Email
    cascade: true
  governing_docs:
    type: array
    label: Governing Documents
    cascade: true
  assistance_links:
    type: array
    label: Assistance Links
    cascade: true
  financial_docs:
    type: array
    label: Financial Transparency Documents
    comment: >-
      ACTION NEEDED: these PDFs (Form 990, tax return, CRI-200) are still hosted
      on the old jacksonsoccer.com DNN website. Re-upload them to Google Drive
      and replace the URLs here BEFORE the old site is retired, or the links
      will break.
    cascade: true
  financial_assistance_text:
    type: textarea
    label: Financial Assistance Explanation
    comment: >-
      Shown above the assistance links on the Club Info page. Leave a blank line
      between paragraphs.
    cascade: true
  peer_mentor_text:
    type: textarea
    label: Peer Mentor Program Explanation
    comment: >-
      Shown above the assistance links on the Club Info page. Leave a blank line
      between paragraphs.
    cascade: true
  sponsor_application_url:
    type: url
    label: Sponsorship Application Form URL
    comment: Google Form businesses use to apply to sponsor the club
    cascade: true
  sponsors_cta_text:
    type: textarea
    label: Sponsorship Call-to-Action Text
    comment: Shown under the sponsor logos, above the application button
    cascade: true
  hero_subtext:
    type: text
    label: Hero Subtext
    cascade: true
  helpful_links:
    type: array
    label: Helpful Links
    cascade: true
  register_button_text:
    type: text
    label: Register Button Text
    cascade: true
  label:
    type: text
    label: Link Text
    comment: The words shown on the link. Emoji at the start of the text are fine.
    cascade: true
  url:
    type: text
    label: Link URL
    comment: >-
      Full address (https://…), a page on this site (travel.html), or leave
      blank where a plain, non-clickable label is wanted.
    cascade: true

  # ── Coaches page ───────────────────────────────────────────
  njys_contact_email:
    type: email
    label: NJYS Coaching Schools Email
    cascade: true
  available_courses:
    type: array
    label: Available Coaching Courses
    cascade: true
  additional_resources:
    type: array
    label: Additional Coaching Resources
    cascade: true
  youth_trainer_links:
    type: array
    label: Youth Trainer Links
    cascade: true
  education_pathway_links:
    type: array
    label: Coaching Education Pathway Links
    cascade: true
  volunteer_cta_email:
    type: email
    label: Coach Volunteer Email
    cascade: true
  volunteer_cta_text:
    type: textarea
    label: Coach Volunteer Callout Text
    cascade: true
  volunteer_cta_link_label:
    type: text
    label: Coach Volunteer Link Text
    cascade: true

  # ── Club Info page ─────────────────────────────────────────
