    type: textarea
    label: Board of Directors Intro Paragraph
    cascade: true
  financial_transparency_text:
    type: textarea
    label: Financial Transparency Paragraph
    cascade: true
  sponsors_intro:
    type: textarea
    label: Sponsors Intro Paragraph
    cascade: true
  sponsors:
    type: array
    label: Partners & Sponsors
    comment: Logos shown at the bottom of the Club Info page
    cascade: true
  logo_url:
    type: image
    label: Sponsor Logo
    comment: Upload a logo image, or paste the address of one hosted elsewhere
    uploads_dir: uploads
    cascade: true

  # ── Travel page ────────────────────────────────────────────
  leagues:
    type: array
    label: Travel Leagues
    comment: Leave the Link URL blank for a league with no website — it shows as plain text
    cascade: true
  leagues_intro:
    type: textarea
    label: Travel Leagues Intro Paragraph
    cascade: true
  tecnica_url:
    type: url
    label: Tecnica Website URL
    cascade: true
  tecnica_link_label:
    type: text
    label: Tecnica Link Text
    cascade: true
  tecnica_social_note:
    type: textarea
    label: Tecnica Social Media Note
    cascade: true
  boys_teams_note_email:
    type: email
    label: Boys Travel Teams Contact Email
    cascade: true
  policy_docs_note_email:
    type: email
    label: Policy Documents Contact Email
    cascade: true

  # ── Recreational page ──────────────────────────────────────
  about_intro:
    type: textarea
    label: About the Program Intro Paragraph
    cascade: true
  divisions:
    type: array
    label: Program Divisions Table
    comment: One entry per row of the Program Divisions table
    cascade: true
  division:
    type: text
    label: Division Name
    cascade: true
  ages:
    type: text
    label: Ages / Grade
    cascade: true
  format:
    type: text
    label: Format
    cascade: true
  schedule:
    type: text
    label: Schedule
    cascade: true
  ball_size:
    type: text
    label: Ball Size
    comment: e.g. Size 3, Size 4, Size 5 — the match ball used by this division
    cascade: true
  divisions_note:
    type: textarea
    label: Program Divisions Footnote
    cascade: true
  how_to_register_bullets:
    type: array
    label: How to Register Steps
    cascade: true
  required_documents_text:
    type: textarea
    label: Required Documents Text
    comment: >-
      The birth certificate / passport and player photo upload requirement.
      Leave a blank line between paragraphs.
    cascade: true
  volunteer_email:
    type: email
    label: Volunteer Coach Email
    cascade: true
  volunteer_text:
    type: textarea
    label: Volunteer Callout Text
    cascade: true
  volunteer_link_label:
    type: text
    label: Volunteer Link Text
    cascade: true
  cta_heading:
    type: text
    label: Registration Banner Heading
    cascade: true
  cta_subtext:
    type: text
    label: Registration Banner Subtext
    cascade: true

  # ── Policies page ──────────────────────────────────────────
  intro:
    type: textarea
    label: Policies Intro Paragraph
    cascade: true
  policies:
    type: array
    label: Club Policies
    comment: >-
      Each policy shows as a collapsible section on the Policies page, grouped
      by Category.
    cascade: true
  category:
    type: select
    label: Category
    comment: Policies are grouped under this heading on the page
    options:
      values:
        - General
        - Codes of Conduct
        - Coaches
    cascade: true
  body:
    type: textarea
    label: Policy Text
    comment: The full text of the policy. Leave a blank line between paragraphs.
    cascade: true
  doc_url:
    type: url
    label: Printable Document URL
    comment: Optional — link to a printable Google Doc or PDF of this policy
    cascade: true

  # ── Homepage ───────────────────────────────────────────────
  directions:
    type: array
    label: Get Directions Links
    cascade: true

  # ── Site-wide navigation & footer (data/site.json) ─────────
  club_name:
    type: text
    label: Club Name
    comment: Shown in the header logo and the footer
    cascade: true
  tagline:
    type: text
    label: Club Tagline
    cascade: true
  address_line1:
    type: text
    label: Footer Address Line 1
    cascade: true
  address_line2:
    type: text
    label: Footer Address Line 2
    cascade: true
  contact_email:
    type: email
    label: Footer Contact Email
    cascade: true
  login_label:
    type: text
    label: Login Button Text
    cascade: true
  login_url:
    type: url
    label: Login Button URL
    cascade: true
  copyright_text:
    type: text
    label: Footer Copyright Text
    comment: The year is added automatically in front of this text
    cascade: true
  nav_links:
    type: array
    label: Main Navigation Links
    comment: >-
      The top navigation bar on every page. Use {{STORE_URL}} or
      {{REGISTER_URL}} as the Link URL to reuse the Club Store URL / Registration
      URL from Settings, so those two addresses only need updating in one place.
    cascade: true
  href:
    type: text
    label: Link URL
    comment: >-
      A page on this site (travel.html), a full https:// address, or the token
      {{STORE_URL}} / {{REGISTER_URL}} to pull the value from Settings.
    cascade: true
  external:
    type: checkbox
    label: Open in a New Tab
    cascade: true
  id:
    type: text
    label: Page ID
    comment: >-
      Internal name used to highlight the current page in the nav — must match
      the page (home, club-info, policies, coaches, travel, recreational,
      fields, calendar, store). Leave as-is unless adding a brand new page.
    cascade: true
  social_links:
    type: array
    label: Social Media Links
    cascade: true
  footer_club_heading:
    type: text
    label: Footer "Club" Column Heading
    cascade: true
  footer_club_links:
    type: array
    label: Footer "Club" Column Links
    cascade: true
  footer_fields_heading:
    type: text
    label: Footer "Fields" Column Heading
    cascade: true
  footer_fields_links:
    type: array
    label: Footer "Fields" Column Links
    cascade: true
  footer_more_heading:
    type: text
    label: Footer "More" Column Heading
    cascade: true
  footer_more_links:
    type: array
    label: Footer "More" Column Links
    comment: >-
      Use {{STORE_URL}} or {{REGISTER_URL}} as a Link URL to reuse the values
      from Settings.
    cascade: true
  hero_subtitle:
    type: text
    label: Page Subtitle
    cascade: true
  approved_note:
    type: text
    label: Board Approval Note
    comment: e.g. Approved by the JSC Board, February 2022
    cascade: true
  confidentiality_text:
    type: textarea
    label: Confidentiality Statement
    cascade: true
  procedures:
    type: array
    label: Request Procedures
    comment: The numbered list of rules families must follow when applying.
    cascade: true
  text:
    type: textarea
    label: Text
    cascade: true
  application_url:
    type: url
    label: Online Application URL
    comment: The Google Form families submit to request assistance.
    cascade: true
  application_button_text:
    type: text
    label: Apply Button Text
    cascade: true
  policy_pdf_url:
    type: text
    label: Policy PDF
    comment: The signed policy document, hosted on this site.
    cascade: true
  policy_pdf_label:
    type: text
    label: Policy PDF Link Text
    cascade: true
  contact_text:
    type: textarea
    label: Questions Text
    cascade: true
