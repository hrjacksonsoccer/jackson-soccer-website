# CloudCannon CMS Configuration — Jackson Soccer Club
# Plain HTML site with JSON-driven content

collections_config:
  pages:
    path: ''
    glob:
      - '*.html'
    output: true
    _enabled_editors:
      - source
    icon: page
    name: Pages

data_config:
  settings:
    path: _data/settings.json
  board:
    path: _data/board.json

_inputs:
  # Settings fields
  register_url:
    type: url
    label: Registration URL
    comment: Link for the "Register Now" button throughout the site
  store_url:
    type: url
    label: Club Store URL
    comment: Link to the team gear store
  field_status_csv:
    type: url
    label: Field Status Google Sheet CSV URL
    comment: "Publish your Field Status sheet: File > Share > Publish to web > CSV, paste URL here"
  announcements_csv:
    type: url
    label: Announcements Google Sheet CSV URL
    comment: Leave blank to use demo announcements
  google_calendar_src:
    type: url
    label: Google Calendar Embed URL
    comment: The src= URL from your Google Calendar embed code

  # Board member fields
  name:
    type: text
    label: Name
  role:
    type: text
    label: Role / Title
  email:
    type: email
    label: Email Address
  open:
    type: checkbox
    label: Open Position
    comment: Check this if the seat is currently vacant

_array_structures:
  board:
    values:
      - label: Board Member
        value:
          name: ''
          role: ''
          email: ''
          open: false
      - label: Open Position
        value:
          name: Open Position
          role: ''
          email: ''
          open: true
